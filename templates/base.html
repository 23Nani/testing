<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Quantum-Resistant LWE Encryption Suite{% endblock %}</title>
    
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <style>
        body {
            background-color: #121212 !important;
            color: #e9ecef !important;
        }
        .card {
            background: #1a1a1a !important;
            border: 1px solid #333 !important;
        }
        .card-body {
            background: #1a1a1a !important;
            color: #e9ecef !important;
        }
        /* REMOVED the form-control styling to keep original input colors */
        .text-muted {
            color: #6c757d !important;
        }
    </style>
    
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-shield-lock"></i>
                LWE Encryption Suite
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
                            <i class="bi bi-lock"></i> Encrypt/Decrypt
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/education' %}active{% endif %}" href="/education">
                            <i class="bi bi-book"></i> Learn
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/benchmark' %}active{% endif %}" href="/benchmark">
                            <i class="bi bi-speedometer2"></i> Benchmark
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        {% block content %}{% endblock %}
    </div>

    <footer class="text-center py-4 mt-5 text-muted">
        <p>Quantum-Resistant LWE Encryption Suite | Post-Quantum Cryptography for the Future</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
